      - "127.0.0.1:5043:8080"

  nutritionservice:
    <<: *development
    ports:
      - "127.0.0.1:5041:8080"

  paymentservice:
    <<: *development
    ports:
      - "127.0.0.1:5035:8080"

  sqlserver:
    ports:
      - "127.0.0.1:11433:1433"

  rabbitmq:
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"
