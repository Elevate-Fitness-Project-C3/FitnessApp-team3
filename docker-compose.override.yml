x-development: &development
  environment:
    ASPNETCORE_ENVIRONMENT: Development

services:
  identityservice:
    <<: *development
    ports:
      - "127.0.0.1:5002:8080"

  fitnessprofileservice:
    <<: *development
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_STATICWEBASSETS: /app/bin/Debug/net10.0/FitnessProfileService.staticwebassets.runtime.CT.json
    ports:
      - "127.0.0.1:5007:8080"

  trainingservice:
    <<: *development
    ports:
      - "127.0.0.1:5296:8080"

  progressservice:
    <<: *development
