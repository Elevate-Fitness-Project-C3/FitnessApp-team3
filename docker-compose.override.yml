services:
  nutritionservice:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Server=nutrition-db;Database=NutritionDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;
    ports:
      - "${NUTRITION_PORT}:8080"

  nutrition-db:
    ports:
      - "${NUTRITION_DB_PORT}:1433"